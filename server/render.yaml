databases:
  - name: student-management-db
    plan: free
    databaseName: student_management
    user: student_management

services:
  - type: web
    name: student-management-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm run db:deploy && npm run start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: http://localhost:3000,https://student-management-dashboard-iota.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: student-management-db
          property: connectionString